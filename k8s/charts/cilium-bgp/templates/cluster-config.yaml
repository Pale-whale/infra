apiVersion: cilium.io/v2
kind: CiliumBGPClusterConfig
metadata:
  name: kubernetes
spec:
  nodeSelector:
    matchLabels:
      kubernetes.io/os: linux
  bgpInstances:
  - name: "kubernetes"
    localASN: {{ .Values.localASN }}
    peers:
    - name: {{ .Values.peer.name }}
      peerASN: {{ .Values.peer.asn }}
      peerAddress: {{ .Values.peer.address | squote }}
      peerConfigRef:
        name: {{ .Values.peer.name }}
