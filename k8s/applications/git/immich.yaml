app:
  name: immich
  project: immich
  source:
    repoURL: git@github.com:immich-app/immich-charts.git
    targetRevision: immich-0.13.1
    path: charts/immich
  destination:
    server: https://kubernetes.default.svc
    namespace: immich
  helm:
    values: |
      immich:
        metrics:
          enabled: true
        persistence:
          library:
            existingClaim: "immich-library"
      controllers:
        main:
          containers:
            main:
              env:
                DB_HOSTNAME:
                  valueFrom:
                    secretKeyRef:
                      name: immich-pg-cluster-app
                      key: host
                DB_USERNAME:
                  valueFrom:
                    secretKeyRef:
                      name: immich-pg-cluster-app
                      key: username
                DB_PASSWORD:
                  valueFrom:
                    secretKeyRef:
                      name: immich-pg-cluster-app
                      key: password
                DB_DATABASE_NAME:
                  valueFrom:
                    secretKeyRef:
                      name: immich-pg-cluster-app
                      key: dbname
      valkey:
        enabled: true
        persistence:
          data:
            enabled: true
            size: 5Gi
            type: persistentVolumeClaim
            accessMode: ReadWriteOnce
            storageClass: ceph-block
      server:
        controllers:
          main:
            pod:
              resources:
                requests:
                  cpu: 50m
                  memory: 400Mi
                limits:
                  memory: 4Gi
        service:
          local:
            enabled: true
            controller: main
            primary: false
            type: LoadBalancer
            loadBalancerIP: 172.17.69.9
            ports:
              http:
                enabled: true
                port: 2283
                targetPort: http
                protocol: HTTP
        serviceMonitor:
          main:
            service:
              name: immich-server-main
        ingress:
          main:
            enabled: true
            hosts:
              - host: immich.palewhale.fr
                paths:
                  - path: "/"
                    service:
                      identifier: main
      machine-learning:
        enabled: true
        controllers:
          main:
            pod:
              resources:
                requests:
                  cpu: 500m
                  memory: 1Gi
                limits:
                  memory: 4Gi
              affinity:
                nodeAffinity:
                  requiredDuringSchedulingIgnoredDuringExecution:
                    nodeSelectorTerms:
                    - matchExpressions:
                      - key: node-role.kubernetes.io/video
                        operator: Exists
            containers:
              main:
                image:
                  # OpenVINO build, for the Intel iGPU passed through to
                  # agent-lubrique (hostpci 0000:00:02 on a Core Ultra 9 285K).
                  # The rest of the acceleration wiring was already here -- the
                  # /dev/dri hostPath below, SYS_ADMIN, and the video nodeAffinity
                  # above -- but the chart has no hwaccel switch, so the plain
                  # CPU image was being used and the iGPU sat idle.
                  #
                  # MUST be bumped in lockstep with the chart's appVersion. The
                  # chart leaves the tag unset so it inherits appVersion (v3.0.0
                  # for chart 0.13.1); pinning it here breaks that link, so a
                  # later chart bump would move immich-server while leaving ML
                  # behind. Immich requires the two versions to match.
                  tag: v3.0.0-openvino
                securityContext:
                  capabilities:
                    add:
                    - SYS_ADMIN
        persistence:
          video:
            enabled: true
            type: hostPath
            hostPath: /dev/dri
          cache:
            enabled: true
            size: 10Gi
            type: persistentVolumeClaim
            accessMode: ReadWriteMany
            storageClass: ceph-filesystem
