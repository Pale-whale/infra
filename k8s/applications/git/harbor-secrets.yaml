app:
  name: harbor-secrets
  project: infra
  source:
    repoURL: git@github.com:pale-whale/infra.git
    targetRevision: HEAD
    path: k8s/charts/anything
  destination:
    server: https://kubernetes.default.svc
    namespace: harbor
  helm:
    values: |
      # The Harbor chart would otherwise bake both of these into a Secret from
      # plain values (defaults "Harbor12345" and "not-a-secure-key"), so they
      # are pulled from Infisical instead and handed to the chart through
      # existingSecretAdminPassword / existingSecretSecretKey.
      adminPassword:
        apiVersion: external-secrets.io/v1
        kind: ExternalSecret
        metadata:
          name: harbor-admin-password
        spec:
          secretStoreRef:
            kind: ClusterSecretStore
            name: infisical
          target:
            name: harbor-admin-password
          data:
            - secretKey: HARBOR_ADMIN_PASSWORD
              remoteRef:
                key: /harbor/admin-password
      secretKey:
        apiVersion: external-secrets.io/v1
        kind: ExternalSecret
        metadata:
          name: harbor-secret-key
        spec:
          secretStoreRef:
            kind: ClusterSecretStore
            name: infisical
          target:
            name: harbor-secret-key
          data:
            # Harbor encrypts the registry credentials it stores in Postgres
            # with this key and it MUST be exactly 16 characters -- changing it
            # later makes every stored credential undecryptable.
            - secretKey: secretKey
              remoteRef:
                key: /harbor/secret-key
