app:
  name: traefik
  project: infra
  source:
    repoURL: git@github.com:traefik/traefik-helm-chart.git
    targetRevision: v37.2.0
    path: traefik
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  helm:
    values: |
      global:
        checkNewVersion: true
        sendAnonymousUsage: false
      providers:
        kubernetesIngress:
          publishedService:
            enabled: false
      service:
        spec:
          externalTrafficPolicy: Local
          loadBalancerIP: 172.17.69.0
      ingressRoute:
        dashboard:
          enabled: true
      ports:
        websecure:
          asDefault: true
          tls:
            certResolver: letsencrypt
            domains:
              # One wildcard rather than a per-host certificate each. Traefik
              # skips a router's own request when a stored certificate already
              # covers the name, so this collapses 13 concurrent DNS-01
              # challenges into one. That concurrency is what broke the first
              # rollout: two challenges racing on the same _acme-challenge name
              # make Cloudflare reject the second with "81058: An identical
              # record already exists", and the orphaned TXT record then blocks
              # every retry until it is deleted by hand.
              # "main", not "name" -- the chart guards the rendered arg on
              # {{ if $domain.main }}, so the entry this replaced never emitted
              # anything at all.
              - main: palewhale.fr
                sans:
                  - '*.palewhale.fr'
      certificatesResolvers:
        letsencrypt:
          acme:
            email: pierre@peloille.com
            caServer: https://acme-v02.api.letsencrypt.org/directory
            dnsChallenge:
              provider: cloudflare
            storage: /data/acme.json
      env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: CF_DNS_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: cloudflare-api-key
              key: apiKey
      updateStrategy:
        # Single replica on a ReadWriteOnce PVC: a surging pod scheduled to a
        # different node than the outgoing one blocks on RBD multi-attach and
        # the rollout stalls. Recreate swaps cleanly at the cost of a couple of
        # seconds of ingress downtime.
        type: Recreate
      podSecurityContext:
        # The chart runs Traefik as 65532 but sets no fsGroup, so the mounted
        # PVC stays root:root 755 and ACME cannot create its storage file:
        # "The ACME resolve is skipped from the resolvers list --
        # unable to get ACME account: open /data/acme.json: permission denied".
        # Every router then silently falls back to Traefik's self-signed
        # default certificate.
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
      persistence:
        enabled: true
        name: data
      #  existingClaim: ""
        accessMode: ReadWriteOnce
        size: 128Mi
        storageClass: "ceph-block"
        path: /data
        annotations: {}
        # subPath: "" # only mount a subpath of the Volume into the pod
