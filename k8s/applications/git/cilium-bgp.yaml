app:
  name: cilium-bgp
  project: infra
  source:
    repoURL: git@github.com:pale-whale/infra.git
    targetRevision: HEAD
    path: k8s/charts/cilium-bgp
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  helm:
    values: |
      # Codified from the running session, which had drifted from git:
      #   live  localASN 64513 -> peerASN 64512 @ 10.0.0.1  (eBGP, established)
      #   git   localASN 64512 -> peerASN 64512 @ 10.0.0.254 (iBGP, wrong)
      # Syncing the old values would have torn down the session and withdrawn
      # the LoadBalancer advertisements (e.g. 172.17.69.9).
      localASN: 64513
      peer:
        name: opnsense
        address: '10.0.0.1'
        asn: 64512
