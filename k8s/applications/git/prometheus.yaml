app:
  name: kube-prometheus-stack
  project: infra
  source:
    repoURL: git@github.com:prometheus-community/helm-charts.git
    targetRevision: kube-prometheus-stack-69.8.2
    path: charts/kube-prometheus-stack
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-prometheus-stack
  helm:
    values: |
      alertmanager:
        enabled: false
      grafana:
        defaultDashboardsTimezone: browser
        # Provision the Ceph (ceph-mixin) Grafana dashboards that the Ceph dashboard
        # embeds on its "Overall Performance" tabs. Their UIDs (e.g. host-details =
        # rtOg0AiWz) are hardcoded in the Ceph dashboard, so we pull the exact JSONs
        # pinned to the running Ceph version. They use the "default" datasource,
        # which is this stack's Prometheus. Fetched by the grafana init container at
        # pod start, so a Grafana restart needs outbound access to raw.githubusercontent.com.
        dashboardProviders:
          dashboardproviders.yaml:
            apiVersion: 1
            providers:
              - name: ceph
                orgId: 1
                folder: Ceph
                type: file
                disableDeletion: false
                editable: true
                options:
                  path: /var/lib/grafana/dashboards/ceph
        dashboards:
          ceph:
            ceph-cluster:
              url: https://raw.githubusercontent.com/ceph/ceph/v19.2.3/monitoring/ceph-mixin/dashboards_out/ceph-cluster.json
            ceph-cluster-advanced:
              url: https://raw.githubusercontent.com/ceph/ceph/v19.2.3/monitoring/ceph-mixin/dashboards_out/ceph-cluster-advanced.json
            hosts-overview:
              url: https://raw.githubusercontent.com/ceph/ceph/v19.2.3/monitoring/ceph-mixin/dashboards_out/hosts-overview.json
            host-details:
              url: https://raw.githubusercontent.com/ceph/ceph/v19.2.3/monitoring/ceph-mixin/dashboards_out/host-details.json
            osds-overview:
              url: https://raw.githubusercontent.com/ceph/ceph/v19.2.3/monitoring/ceph-mixin/dashboards_out/osds-overview.json
            osd-device-details:
              url: https://raw.githubusercontent.com/ceph/ceph/v19.2.3/monitoring/ceph-mixin/dashboards_out/osd-device-details.json
            pool-overview:
              url: https://raw.githubusercontent.com/ceph/ceph/v19.2.3/monitoring/ceph-mixin/dashboards_out/pool-overview.json
            pool-detail:
              url: https://raw.githubusercontent.com/ceph/ceph/v19.2.3/monitoring/ceph-mixin/dashboards_out/pool-detail.json
            rbd-overview:
              url: https://raw.githubusercontent.com/ceph/ceph/v19.2.3/monitoring/ceph-mixin/dashboards_out/rbd-overview.json
            rbd-details:
              url: https://raw.githubusercontent.com/ceph/ceph/v19.2.3/monitoring/ceph-mixin/dashboards_out/rbd-details.json
            cephfs-overview:
              url: https://raw.githubusercontent.com/ceph/ceph/v19.2.3/monitoring/ceph-mixin/dashboards_out/cephfs-overview.json
        ingress:
          enabled: true
          hosts:
            - grafana.palewhale.fr
        persistence:
          enabled: true
          storageClassName: ceph-block
          size: 20Gi
        grafana.ini:
          server:
            root_url: https://grafana.palewhale.fr
            domain: grafana.palewhale.fr
          security:
            # Let the Ceph dashboard (ceph.palewhale.fr) embed Grafana panels in
            # iframes on its "Overall Performance" tabs. Without this, Grafana sends
            # X-Frame-Options: deny and the iframes stay blank. Both hosts are
            # *.palewhale.fr (same-site), so the viewer's Keycloak SSO cookie flows
            # into the iframe — no anonymous access is enabled (Grafana is public).
            allow_embedding: true
          auth.generic_oauth:
            enabled: true
            name: Keycloak
            role_attribute_path: |
              contains(roles[*], 'grafanaadmin') && 'GrafanaAdmin' || contains(roles[*], 'admin') && 'Admin' || contains(roles[*], 'editor') && 'Editor' || 'Viewer'
            allow_assign_grafana_admin: true
            client_id: grafana
            client_secret: $__file{/etc/secrets/oauth_secrets/client_secret}
            auth_url: "https://keycloak.palewhale.fr/realms/homelab/protocol/openid-connect/auth"
            token_url: "https://keycloak.palewhale.fr/realms/homelab/protocol/openid-connect/token"
            api_url: "https://keycloak.palewhale.fr/realms/homelab/protocol/openid-connect/userinfo"
        extraSecretMounts:
          - name: oauth-secrets-mount
            secretName: oauth
            defaultMode: 0440
            mountPath: /etc/secrets/oauth_secrets
            readOnly: true
      prometheus:
        prometheusSpec:
          serviceMonitorSelectorNilUsesHelmValues: false
          retention: 15d
          scrapeInterval: 30s
          resources:
            requests:
              memory: 4Gi
              cpu: 500m
            limits:
              memory: 8Gi
              cpu: 3500m
          storageSpec:
            volumeClaimTemplate:
              spec:
                storageClassName: ceph-block
                accessModes:
                  - ReadWriteOnce
                resources:
                  requests:
                    storage: 64Gi
