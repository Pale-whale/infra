app:
  name: mcr-operator
  project: infra
  source:
    repoURL: git@github.com:Pale-whale/mcr-operator.git
    # Tracks the default branch the same way the other first-party charts here
    # do. That means a release lands as soon as it is merged, so read the
    # CHANGELOG before merging a breaking one - 0.1.0 moved every
    # server.properties key into spec.properties.
    targetRevision: HEAD
    path: deploy/chart/mcr-operator
  destination:
    server: https://kubernetes.default.svc
    namespace: mcr-operator
  helm:
    values: |
      image:
        # No tag: it follows the chart's appVersion, so a release bumps one
        # field rather than two.
        repository: oci.palewhale.fr/library/mcr-operator
      imagePullSecrets: []
      replicaCount: 1
      leaderElection: false
      metrics:
        bindAddress: ''
      resources:
        limits:
          memory: 256Mi
        requests:
          cpu: 50m
          memory: 128Mi
