app:
  name: mcr-newnouns
  project: infra
  source:
    repoURL: git@github.com:Pale-whale/mcr-operator.git
    targetRevision: HEAD
    path: deploy/chart/mcr-cluster
  destination:
    server: https://kubernetes.default.svc
    namespace: minecraft
  helm:
    values: |
      clusterName: newnouns
      router:
        # The router fronts several proxies and picks between them by hostname.
        # There is one proxy here, so players connect to its service directly
        # and the extra hop buys nothing.
        enable: false
      proxies:
        velocity:
          motd: Welcome to new nouns
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 512Mi
          service:
            type: LoadBalancer
            loadBalancerIP: 172.17.69.25
      servers:
        main:
          eula: true
          # Players entering through the proxy land on a server tagged "lobby".
          # That is the role, not the name, so it stays put through the rename.
          tags:
            - lobby
          version: '26.2'
          properties:
            difficulty: normal
            gamemode: survival
            force-gamemode: 'true'
            level-name: newnouns
            # Only read when the world is first generated; kept so the spec
            # still says what this world was made from.
            level-seed: '-3899835130120818196'
          whitelist:
            - nouns_lover
            - Nouns_mommy
          ops:
            - nouns_lover
          storage:
            size: 20Gi
            storageClass: ceph-block
            # Takes over the world the deleted "lobby" server left behind
            # instead of starting from an empty volume. Nothing is copied: the
            # claim keeps the name "lobby", because a claim cannot be renamed.
            #
            # The source server has to be gone first, which is what stops two
            # servers ever holding one volume, and its world survives the
            # delete because storage.reclaimPolicy defaults to Retain.
            #
            # Read once, when the claim is adopted. The API server rejects any
            # later edit to it, and rejects removing spec.storage while it is
            # set, so these three lines are permanent.
            source:
              server: lobby
              mode: Move
          resources:
            limits:
              memory: 2Gi
            requests:
              cpu: '1'
              memory: 2Gi
          bluemap:
            # Renders a 3D web map from the world volume, mounted read-only, in
            # a container beside the server rather than as a Paper plugin.
            ingress:
              className: traefik
              host: newnouns.palewhale.fr
              annotations:
                external-dns.alpha.kubernetes.io/cloudflare-proxied: 'false'
                traefik.ingress.kubernetes.io/router.middlewares: traefik-traefik-forward-auth@kubernetescrd
            resources:
              limits:
                cpu: '2'
                memory: 1Gi
              requests:
                cpu: 500m
                memory: 1Gi
