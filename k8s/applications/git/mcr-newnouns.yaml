app:
  name: mcr-newnouns
  project: infra
  source:
    repoURL: git@github.com:Pale-whale/mcr-operator.git
    targetRevision: HEAD
    path: deploy/chart/mcr-cluster
  destination:
    server: https://kubernetes.default.svc
    namespace: minecraft
  helm:
    values: |
      clusterName: newnouns
      router:
        enable: false
      # One BlueMap web map for the servers below that set bluemap: true. The
      # BlueMap plugin on each renders into a CloudNativePG database the
      # operator creates (newnouns-bluemap-db), and one webserver serves it.
      bluemap:
        enabled: true
        database:
          size: 20Gi
          storageClassName: ceph-block
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
        web:
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          ingress:
            className: traefik
            host: newnouns.palewhale.fr
            annotations:
              external-dns.alpha.kubernetes.io/cloudflare-proxied: 'false'
              traefik.ingress.kubernetes.io/router.middlewares: traefik-traefik-forward-auth@kubernetescrd
      proxies:
        velocity:
          motd: Welcome to new nouns
          minecraftVersion: '26.2'
          plugins:
            # Pinned by version ID, not 1.1.0: that release declares support
            # only to 1.21.11 and a version-number pin is filtered against
            # minecraftVersion. qcFMObz9 is release 1.1.0.
            - simple-reconnect:qcFMObz9
            - velocity-auto-reconnect:1.1.0
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 512Mi
          service:
            type: LoadBalancer
            loadBalancerIP: 172.17.69.25
      servers:
        hub:
          eula: true
          tags:
            - lobby
          version: '26.2'
          properties:
            difficulty: peaceful
            gamemode: adventure
            force-gamemode: 'true'
            level-name: hub
          plugins:
            - portals-1:1.7.0
            - worldedit:7.4.5
          whitelist:
            - nouns_lover
            - Nouns_mommy
          ops:
            - nouns_lover
          storage:
            size: 5Gi
            storageClass: ceph-block
          resources:
            limits:
              memory: 2Gi
            requests:
              cpu: 250m
              memory: 1Gi
          env:
            - name: RCON_CMDS_STARTUP
              value: gamerule doMobSpawning false
        main:
          eula: true
          tags:
            - main
          version: '26.2'
          properties:
            difficulty: normal
            gamemode: survival
            force-gamemode: 'true'
            level-name: newnouns
            level-seed: '-3899835130120818196'
          plugins:
            - portals-1:1.7.0
            - worldedit:7.4.5
            - gsit:3.5.1
            - axgraves:1.31.0
            - sleep-plugin:1.0.4
            - thizzyz-tree-feller:1.31.0
            - smartinv:1.5
            - better-shulkers:mc26.2-2.0.0
            - veinminer:2.12.1
            - fastleafdecay:1.0.8
            - chunky:1.5.3
          whitelist:
            - nouns_lover
            - Nouns_mommy
          ops:
            - nouns_lover
          storage:
            size: 40Gi
            storageClass: ceph-block
            source:
              server: lobby
              mode: Move
          resources:
            limits:
              memory: 15Gi
            requests:
              cpu: '1'
              memory: 15Gi
          env:
            - name: USE_AIKAR_FLAGS
              value: 'true'
          jvmOpts:
            - -XX:InitialRAMPercentage=75
          # Renders into the cluster's map, with the plugin inside this JVM.
          bluemap: true
