app:
  name: mcr-newnouns
  project: infra
  source:
    repoURL: git@github.com:Pale-whale/mcr-operator.git
    targetRevision: HEAD
    path: deploy/chart/mcr-cluster
  destination:
    server: https://kubernetes.default.svc
    namespace: minecraft
  helm:
    values: |
      clusterName: newnouns
      router:
        # The router fronts several proxies and picks between them by hostname.
        # There is one proxy here, so players connect to its service directly
        # and the extra hop buys nothing.
        enable: false
      proxies:
        velocity:
          motd: Welcome to new nouns
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 512Mi
          service:
            type: LoadBalancer
            loadBalancerIP: 172.17.69.25
      servers:
        lobby:
          eula: true
          # Players entering through the proxy land on a server tagged "lobby".
          tags:
            - lobby
          version: '26.2'
          # The whole of server.properties, one key per line, values as
          # strings. level-name is the world folder on the volume: without it
          # the server generates a fresh world at world/ and leaves newnouns/
          # sitting there unused. difficulty and gamemode are applied to the
          # running server; the rest are read at startup and replace the pod.
          properties:
            difficulty: normal
            gamemode: survival
            force-gamemode: 'true'
            level-name: newnouns
            # Only read when the world is first generated; kept so the spec
            # still says what this world was made from.
            level-seed: '-3899835130120818196'
          whitelist:
            - nouns_lover
            - Nouns_mommy
          ops:
            - nouns_lover
          storage:
            size: 20Gi
            storageClass: ceph-block
          resources:
            limits:
              memory: 2Gi
            requests:
              cpu: '1'
              memory: 2Gi
          bluemap:
            # Renders a 3D web map from the world volume, mounted read-only, in
            # a container beside the server rather than as a Paper plugin.
            ingress:
              className: traefik
              host: newnouns.palewhale.fr
              annotations:
                external-dns.alpha.kubernetes.io/cloudflare-proxied: 'false'
                traefik.ingress.kubernetes.io/router.middlewares: traefik-traefik-forward-auth@kubernetescrd
            resources:
              limits:
                cpu: '2'
                memory: 1Gi
              requests:
                cpu: 500m
                memory: 1Gi
