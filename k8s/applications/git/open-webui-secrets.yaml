app:
  name: open-webui-secrets
  project: ai
  source:
    repoURL: git@github.com:pale-whale/infra.git
    targetRevision: HEAD
    path: k8s/charts/anything
  destination:
    server: https://kubernetes.default.svc
    namespace: ai
  helm:
    values: |
      oidc:
        apiVersion: external-secrets.io/v1
        kind: ExternalSecret
        metadata:
          name: open-webui-oidc
        spec:
          secretStoreRef:
            kind: ClusterSecretStore
            name: infisical
          target:
            name: open-webui-oidc
          data:
            - secretKey: client-secret
              remoteRef:
                key: /open-webui/oidc-client-secret
      secretKey:
        apiVersion: external-secrets.io/v1
        kind: ExternalSecret
        metadata:
          name: open-webui-secret-key
        spec:
          secretStoreRef:
            kind: ClusterSecretStore
            name: infisical
          target:
            name: open-webui-secret-key
          data:
            # Signs session JWTs; rotating it logs every user out.
            - secretKey: secret-key
              remoteRef:
                key: /open-webui/secret-key
