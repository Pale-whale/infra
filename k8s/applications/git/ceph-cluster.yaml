app:
  name: ceph-cluster
  project: infra
  source:
    repoURL: git@github.com:rook/rook.git
    targetRevision: v1.20.3
    path: deploy/charts/rook-ceph-cluster
  destination:
    server: https://kubernetes.default.svc
    namespace: rook-ceph
  helm:
    values: |
      operatorNamespace: rook-ceph
      clusterName: homelab
      cephImage:
        # Tentacle. v20.2.2 specifically, not v20.2.0: that release has a known
        # data-corruption bug when the CSI "read affinity" feature is enabled.
        # Rook 1.20.3 supports both Squid (19) and Tentacle (20) — minimum 19.2.0 —
        # so this is a deliberate move, not one forced by the operator bump.
        tag: v20.2.2
        allowUnsupported: false
      toolbox:
        enabled:
          true
      monitoring:
        enabled: true
      cephClusterSpec:
        # NEVER change this value
        dataDirHostPath: /var/lib/rook
        mon:
          count: 3
          allowMultiplePerNode: false
          volumeClaimTemplate:
            spec:
              storageClassName: proxmox-nvme-xfs
              resources:
                requests:
                  storage: 10Gi
        mgr:
          count: 2
          allowMultiplePerNode: false
          modules:
            - name: rook
              enabled: true
        dashboard:
          enabled: true
          ssl: false
          # Point the dashboard at the in-cluster kube-prometheus-stack so its
          # native Prometheus-backed graphs render (otherwise the dashboard warns
          # that monitoring is not configured). Rook's dashboard controller owns
          # the mgr/dashboard/PROMETHEUS_API_* options and reconciles them from
          # these fields, so they MUST be set here — setting them via cephConfig
          # does not stick (the operator resets them on every dashboard reconcile).
          # SSL verify is off because the target is plain HTTP in-cluster.
          prometheusEndpoint: http://kube-prometheus-stack-prometheus.kube-prometheus-stack.svc:9090
          prometheusEndpointSSLVerify: false
        network:
          connections:
            encryption:
              enabled: false
            # Msgr compression is OFF on purpose. Every agent VM runs on the SAME
            # physical Proxmox node (mother-brain), so OSD-to-OSD replication never
            # leaves the host and there is no link to relieve. Enabling it only set
            # `ms_osd_compress_mode force`, burning CPU on 4-core VMs to compress
            # traffic that costs nothing to move.
            compression:
              enabled: false
            requireMsgr2: true
        logCollector:
          enabled: true
          periodicity: daily
          maxLogSize: 500M
        skipUpgradeChecks: false
        continueUpgradeAfterChecksEvenIfNotHealthy: false
        # OSD hardware (all consumer, none with power-loss protection), attached
        # over virtio-scsi from the single Proxmox node mother-brain:
        #   agent-milo   scsi2 -> Samsung 870 QVO 4TB   (QLC — see below)
        #                scsi3 -> WD Red SA500 4TB      (TLC)
        #                scsi4 -> WD Red SA500 4TB      (TLC)
        #   agent-dewey  scsi2 -> Samsung 870 EVO 4TB   (TLC)
        #                scsi3 -> WD Red SA500 4TB      (TLC)
        #                scsi4 -> WD Red SA500 4TB      (TLC)
        #   agent-rupert PCIe  -> Samsung 9100 PRO 8TB NVMe (PCIe passthrough)
        #                scsi2 -> WD Red SA500 4TB      (TLC)
        #
        # Without PLP, O_DSYNC latency is fine at low queue depth but collapses
        # under concurrent background IO, freezing client-facing workloads — hence
        # high_client_ops and a single concurrent scrub.
        #
        # agent-milo scsi2 is the outlier: it is the only QLC drive, and it measures
        # ~70ms kv_sync_lat against ~4-7ms for the TLC drives on identical VM config.
        # QLC collapses once its SLC write cache is exhausted. No tuning fixes that —
        # replacing the drive, or steering latency-critical pools off it with a
        # separate device class, is the only real remedy.
        #
        # Note mclock's auto-benchmark overestimates these drives badly (it measured
        # 56-77k IOPS); the per-OSD values are cleared and re-measured on an idle
        # cluster rather than trusted blindly.
        cephConfig:
          # GRAFANA_API_URL is the browser-reachable Grafana behind the dashboard's
          # "Overall Performance" iframe embeds. Unlike the Prometheus endpoint (owned
          # by Rook via dashboard.prometheusEndpoint above), Rook does NOT manage the
          # mgr/dashboard/GRAFANA_* options, so cephConfig is durable here. SSL verify
          # stays on (valid public cert); the mgr must not push dashboards since the
          # Grafana chart provisions the ceph-mixin set.
          mgr:
            "mgr/dashboard/GRAFANA_API_URL": "https://grafana.palewhale.fr"
            "mgr/dashboard/GRAFANA_API_SSL_VERIFY": "true"
            "mgr/dashboard/GRAFANA_UPDATE_DASHBOARDS": "false"
          osd:
            osd_mclock_profile: "high_client_ops"
            osd_max_scrubs: "1"
            # BlueStore disables deferred writes for SSD-class devices by default
            # (bluestore_prefer_deferred_size_ssd = 0), which is right for enterprise
            # drives but wrong here: it sends every small random write straight to a
            # PLP-less consumer SSD as O_DSYNC. Deferring sub-32K writes turns them
            # into sequential RocksDB WAL appends flushed to the data area in batches.
            # Tradeoff: small writes are written twice, costing endurance — most on
            # the QLC drive. Revert this key alone if client latency gets worse.
            bluestore_prefer_deferred_size_ssd: "32768"
            # 5Gi, not the 4Gi compiled-in default: the OSD pods already reserve the
            # memory, so without this ~2Gi/OSD was reserved but unusable. Capped at
            # 5Gi rather than matching the 6Gi limit because osd_memory_target excludes
            # ~15% expected fragmentation (a 6Gi target under a 6Gi cgroup limit would
            # OOMKill), and because milo/dewey run THREE OSDs each against ~23.5Gi of
            # allocatable RAM — 3x6Gi of real usage does not fit alongside everything
            # else on the node.
            osd_memory_target: "5368709120"
        placement:
          mon:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists
            tolerations:
              - key: "node-role.kubernetes.io/control-plane"
                operator: "Exists"
                effect: "NoSchedule"
          mgr:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists
            tolerations:
              - key: "node-role.kubernetes.io/control-plane"
                operator: "Exists"
                effect: "NoSchedule"
        resources:
          mon:
            limits:
              memory: 2Gi
            requests:
              cpu: 500m
              memory: 1Gi
          mgr:
            limits:
              memory: 2Gi
            requests:
              cpu: 300m
              memory: 512Mi
          osd:
            limits:
              memory: "6Gi"
            requests:
              cpu: "1"
              # Matches osd_memory_target above, so the reservation is honest rather
              # than padding. The limit keeps ~20% headroom over the target for the
              # fragmentation BlueStore's autotuner does not account for. Dropping
              # from 6Gi frees 3Gi of requests on milo/dewey, which each run three
              # OSDs and had been reserving 18Gi — enough to leave Prometheus
              # unschedulable when the third disk was added.
              memory: "5Gi"
        disruptionManagement:
          managePodBudgets: true
          osdMaintenanceTimeout: 30
        storage:
          useAllNodes: false
          useAllDevices: false
          allowDeviceClassUpdate: true
          nodes:
            - name: "agent-milo"
              devices:
                - deviceClass: ssd
                  name: "/dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi2"
                - deviceClass: ssd
                  name: "/dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi3"
                - deviceClass: ssd
                  name: "/dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi4"
            - name: "agent-dewey"
              devices:
                - deviceClass: ssd
                  name: "/dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi2"
                - deviceClass: ssd
                  name: "/dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi3"
                - deviceClass: ssd
                  name: "/dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi4"
            - name: "agent-rupert"
              devices:
                - deviceClass: nvme
                  name: "/dev/disk/by-id/nvme-Samsung_SSD_9100_PRO_8TB_S7YHNJ0Y903438J"
                - deviceClass: ssd
                  name: "/dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi2"
      ingress:
        dashboard:
          annotations:
            traefik.ingress.kubernetes.io/router.middlewares: traefik-traefik-forward-auth@kubernetescrd
          host:
            name: ceph.palewhale.fr
            path: "/"
            pathType: Prefix
      cephBlockPools:
        - name: ceph-blockpool
          spec:
            failureDomain: host
            replicated:
              size: 2
          storageClass:
            enabled: true
            name: ceph-block
            isDefault: true
            reclaimPolicy: Delete
            allowVolumeExpansion: true
            volumeBindingMode: "Immediate"
            parameters:
              imageFormat: "2"
              imageFeatures: layering,fast-diff,object-map,deep-flatten,exclusive-lock
              csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
              csi.storage.k8s.io/provisioner-secret-namespace: "{{ .Release.Namespace }}"
              csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
              csi.storage.k8s.io/controller-expand-secret-namespace: "{{ .Release.Namespace }}"
              csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
              csi.storage.k8s.io/node-stage-secret-namespace: "{{ .Release.Namespace }}"
              csi.storage.k8s.io/fstype: ext4
      cephFileSystems:
        - name: ceph-filesystem
          spec:
            metadataPool:
              replicated:
                size: 3
            dataPools:
              - failureDomain: host
                replicated:
                  size: 2
                name: data0
            metadataServer:
              activeCount: 1
              activeStandby: true
              resources:
                limits:
                  memory: "4Gi"
                requests:
                  cpu: "1"
                  memory: "4Gi"
              priorityClassName: system-cluster-critical
          storageClass:
            enabled: true
            isDefault: false
            name: ceph-filesystem
            pool: data0
            reclaimPolicy: Delete
            allowVolumeExpansion: true
            volumeBindingMode: "Immediate"
            mountOptions:
              - ms_mode=secure
            parameters:
              csi.storage.k8s.io/provisioner-secret-name: rook-csi-cephfs-provisioner
              csi.storage.k8s.io/provisioner-secret-namespace: "{{ .Release.Namespace }}"
              csi.storage.k8s.io/controller-expand-secret-name: rook-csi-cephfs-provisioner
              csi.storage.k8s.io/controller-expand-secret-namespace: "{{ .Release.Namespace }}"
              csi.storage.k8s.io/controller-publish-secret-name: rook-csi-cephfs-provisioner
              csi.storage.k8s.io/controller-publish-secret-namespace: "{{ .Release.Namespace }}"
              csi.storage.k8s.io/node-stage-secret-name: rook-csi-cephfs-node
              csi.storage.k8s.io/node-stage-secret-namespace: "{{ .Release.Namespace }}"
              csi.storage.k8s.io/fstype: ext4
      cephObjectStores: {}
