app:
  name: mcr-newnoons
  project: infra
  source:
    repoURL: git@github.com:Pale-whale/mcr-operator.git
    targetRevision: HEAD
    path: deploy/chart/mcr-cluster
  destination:
    server: https://kubernetes.default.svc
    namespace: minecraft
  helm:
    values: |
      # Renders a Cluster, a Proxy and a Server. These are custom resources, so
      # this app only syncs cleanly once mcr-operator has installed the CRDs --
      # sync that one first.
      clusterName: newnoons
      router:
        # The router fronts several proxies and picks between them by hostname.
        # There is one proxy here, so players connect to its service directly
        # and the extra hop buys nothing.
        enable: false
      proxies:
        velocity:
          motd: Welcome to new noons
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 512Mi
          service:
            type: LoadBalancer
            # Cilium advertises the pool 172.17.0.0/16 over BGP. Pinned rather
            # than left to IPAM so the address players connect to survives a
            # recreate, matching traefik (.0) and immich (.9).
            loadBalancerIP: 172.17.69.25
      servers:
        lobby:
          # The operator refuses to start a server until this is set.
          eula: true
          # Players entering through the proxy land on a server tagged "lobby".
          tags:
            - lobby
          version: '1.26.2'
          difficulty: normal
          mode: survival
          storage:
            size: 10Gi
            storageClass: ceph-block
          # A vanilla server idles well under this; the limit is deliberately
          # equal to the request so the JVM heap sits in a guaranteed slice and
          # is not reclaimed under node pressure.
          resources:
            limits:
              memory: 2Gi
            requests:
              cpu: '1'
              memory: 2Gi
