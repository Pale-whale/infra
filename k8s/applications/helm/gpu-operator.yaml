app:
  name: gpu-operator
  project: infra
  source:
    repoURL: https://helm.ngc.nvidia.com/nvidia
    chart: gpu-operator
    # Talos v1.13.0 CI tests v26.3.1; stay on that minor.
    targetRevision: v26.3.3
  destination:
    server: https://kubernetes.default.svc
    namespace: gpu-operator
  helm:
    values: |
      # Driver and toolkit come from the Talos system extensions
      # (nvidia-open-gpu-kernel-modules-production, nvidia-container-toolkit-production),
      # which also generate the CDI spec on the node.
      driver:
        enabled: false
      toolkit:
        enabled: false
      hostPaths:
        driverInstallDir: /usr/local
      devicePlugin:
        env:
          # The device plugin writes a CDI spec whose hooks point at
          # /usr/bin/nvidia-ctk, but the nvidia-container-toolkit extension puts it
          # under /usr/local/bin. Without this, any pod with an nvidia.com/gpu limit
          # dies at container create:
          #   error running createContainer hook #0:
          #   fork/exec /usr/bin/nvidia-cdi-hook: no such file or directory
          # Affects Talos >= v1.13, where CDI is enabled by default.
          # siderolabs/talos#13021. driverInstallDir above does NOT cover this.
          - name: NVIDIA_CDI_HOOK_PATH
            value: /usr/local/bin/nvidia-cdi-hook
